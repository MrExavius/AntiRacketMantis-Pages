name: Site quality and GitHub Pages deploy

# The site is generated by scripts/build.mjs into dist/ (not tracked).
# Every push and pull request runs the quality gate; only a push to main deploys.
# Requires Settings → Pages → Source = "GitHub Actions" (build_type: workflow).
# The custom domain comes from the repository Pages settings (see CNAME for reference).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Check JavaScript syntax
        run: |
          for file in src/*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Checker regression tests
        run: node scripts/test-check.mjs

      - name: Build and run site checks
        run: |
          node scripts/build.mjs
          # sitemap lastmod dates are part of the source: rebuild locally and commit them.
          git diff --exit-code -- scripts/sitemap-lastmod.json

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Build
        id: build
        run: |
          node scripts/build.mjs
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          echo "index_sha=$(sha256sum dist/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_INDEX_SHA: ${{ steps.build.outputs.index_sha }}
        run: |
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 12); do
            served="$(curl -s --max-time 20 "$base/" | sha256sum | cut -d' ' -f1 || true)"
            if [ "$served" = "$EXPECTED_INDEX_SHA" ]; then
              echo "OK: $base/ serves the new build"
              for path in robots.txt sitemap.xml; do
                code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base/$path")"
                test "$code" = "200" || { echo "FAIL: /$path returned $code"; exit 1; }
              done
              exit 0
            fi
            echo "Attempt $attempt/12: index sha ${served:-none}, expected $EXPECTED_INDEX_SHA"
            sleep 10
          done
          exit 1
