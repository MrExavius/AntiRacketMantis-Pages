<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 530" role="img" aria-labelledby="title description">
 <title id="title">Minty searching for a missing page</title>
 <desc id="description">Mint-green cartoon mantis mascot holding a magnifying glass and looking curiously around for a missing webpage.</desc>
 <defs>
  <linearGradient id="body" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#c3f48d"/><stop offset=".46" stop-color="#86db78"/><stop offset="1" stop-color="#45ad70"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5fb9d"/><stop offset=".53" stop-color="#9eeb87"/><stop offset="1" stop-color="#62c987"/></linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#a5e3c7"/><stop offset="1" stop-color="#5eb9a0"/></linearGradient>
  <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b6554"/><stop offset="1" stop-color="#17443f"/></linearGradient>
  <radialGradient id="glass" cx=".35" cy=".35" r=".7"><stop stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#cdeeff" stop-opacity=".55"/></radialGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
 </defs>
