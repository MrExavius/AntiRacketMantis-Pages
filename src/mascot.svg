 <title id="title">Богомол Минти приветственно машет лапкой</title>
 <desc id="description">Улыбающийся мятно-зелёный мультяшный богомол AntiRacketMantis с антеннами-листочками, щитом на груди и поднятой в приветствии лапкой.</desc>
