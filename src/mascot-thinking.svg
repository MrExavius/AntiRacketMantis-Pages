  <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5fb9d"/><stop offset=".53" stop-color="#9eeb87"/><stop offset="1" stop-color="#62c987"/></linearGradient>
  <linearGradient id="wing" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#a5e3c7"/><stop offset="1" stop-color="#5eb9a0"/></linearGradient>
  <linearGradient id="eye" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b6554"/><stop offset="1" stop-color="#17443f"/></linearGradient>
  <radialGradient id="shine"><stop stop-color="#fff" stop-opacity=".68"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
 </defs>
