<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 530" role="img" aria-labelledby="title description">
 <title id="title">Богомол Минти задумчиво ищет ответ</title>
 <desc id="description">Задумчивый мятно-зелёный богомол AntiRacketMantis приложил лапку к подбородку и смотрит на облачко с вопросом.</desc>
